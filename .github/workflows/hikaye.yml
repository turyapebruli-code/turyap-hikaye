name: Instagram hikaye paylas

on:
  schedule:
    # Her saat uyanir; paylas.py son paylasimdan 7 saat gectiyse paylasir.
    # (24 saat 7'ye bolunmedigi icin sabit cron yerine bu yontem kullanildi.)
    - cron: "17 * * * *"
  workflow_dispatch:        # Elle de calistirilabilsin

permissions:
  contents: write           # durum.json'u geri yazabilmek icin

concurrency:
  group: hikaye
  cancel-in-progress: false

jobs:
  paylas:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hikayeyi paylas
        env:
          IG_KULLANICI_ID: ${{ secrets.IG_KULLANICI_ID }}
          ERISIM_ANAHTARI: ${{ secrets.ERISIM_ANAHTARI }}
          ZORLA: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python paylas.py

      - name: Sirayi kaydet
        run: |
          if git diff --quiet durum.json; then
            echo "durum.json degismedi"
          else
            git config user.name "turyap-bot"
            git config user.email "bot@users.noreply.github.com"
            git add durum.json
            git commit -m "sira ilerledi"
            git push
          fi
